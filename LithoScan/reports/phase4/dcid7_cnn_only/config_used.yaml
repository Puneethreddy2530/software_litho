augmentation:
  enabled: true
  horizontal_flip: true
  rotation_degrees: 15
  vertical_flip: true
dataloader:
  batch_size: 4
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  seed: 42
dataset:
  dcid_root: C:/Users/punee/Desktop/Software_lithology/DCID/DCID
  noise_version: noise-512-7
  num_classes: 7
  test_split: test
  train_split: train
  version: DCID-512-7
model:
  architecture_mode: cnn_only
  dropout: 0.1
  embed_dim: 512
  num_heads: 8
  num_layers: 2
  pretrained: true
output:
  checkpoint_dir: checkpoints/phase4/dcid7_cnn_only
  log_dir: reports/phase4/dcid7_cnn_only
preprocessing:
  image_size: 512
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
training:
  amp: true
  early_stopping_patience: 7
  epochs: 30
  gradient_accumulation: 4
  learning_rate: 0.0001
  optimizer: AdamW
  scheduler: CosineAnnealingLR
  weight_decay: 0.0001
