# =============================================================================
# Phase 4C: Full Experiment Runner Configuration (DCID-7 CNN-Only Ablation)
# =============================================================================

dataset:
  version: "DCID-512-7"
  noise_version: "noise-512-7"
  num_classes: 7
  dcid_root: "C:/Users/punee/Desktop/Software_lithology/DCID/DCID"
  train_split: "train"
  test_split: "test"

preprocessing:
  image_size: 512
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 15

dataloader:
  batch_size: 4             # Optimized for RTX 3050 6GB
  num_workers: 4
  pin_memory: true
  seed: 42
  persistent_workers: true

model:
  architecture_mode: "cnn_only"
  pretrained: true
  embed_dim: 512
  num_heads: 8
  num_layers: 2
  dropout: 0.1

training:
  epochs: 30
  early_stopping_patience: 7
  optimizer: "AdamW"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "CosineAnnealingLR"
  amp: true
  gradient_accumulation: 4

output:
  checkpoint_dir: "checkpoints/phase4/dcid7_cnn_only"
  log_dir: "reports/phase4/dcid7_cnn_only"
